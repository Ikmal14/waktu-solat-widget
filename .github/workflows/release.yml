# Publishes a GitHub Release whenever the version in WaktuSolat.csproj changes on main:
# builds WaktuSolat.exe from source on Windows, runs the tests, creates tag vX.Y.Z + release.
# Already-released versions are skipped. Uses only GitHub's built-in token — no stored secrets.
name: release

on:
  push:
    branches: [main]
    paths: ['WaktuSolat.csproj', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write       # create tag + release
  id-token: write       # build provenance attestation (Sigstore)
  attestations: write

concurrency: release

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = ([xml](Get-Content WaktuSolat.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Bad version '$v'" }
          gh release view "v$v" *> $null
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "exists=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Build
        if: steps.v.outputs.exists == '0'
        run: dotnet build -c Release -nologo

      - name: Test
        if: steps.v.outputs.exists == '0'
        run: dotnet run -c Release --project tests/Tests.csproj

      - name: Attest build provenance
        if: steps.v.outputs.exists == '0'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/Release/net48/WaktuSolat.exe

      - name: Publish release
        if: steps.v.outputs.exists == '0'
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          $exe = "bin/Release/net48/WaktuSolat.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          @"
          **Download ``WaktuSolat.exe`` below**, put it somewhere permanent (e.g. ``Documents\WaktuSolat\``) and run it. Windows 10/11, no install, no admin.

          Updating from v5.1 or later: click **"Versi … tersedia"** in the widget — it downloads, verifies and installs itself, then removes the old version. From v5.0: right-click the tray icon → **Keluar**, replace the exe, run it. Settings are kept.

          Built from source by GitHub Actions. SHA-256: ``$sha``

          Verify it was built from this repo: ``gh attestation verify WaktuSolat.exe --repo Ikmal14/waktu-solat-widget``

          The exe isn't code-signed: if SmartScreen appears, choose **More info → Run anyway**.
          "@ | Set-Content notes.md
          gh release create $env:TAG $exe --target $env:GITHUB_SHA --title "Waktu Solat $env:TAG" --notes-file notes.md
